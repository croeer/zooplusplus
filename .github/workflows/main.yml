name: Deploy to AWS CodeArtifact

permissions:
  id-token: write
  contents: read
      
on:
  push:
    branches:
      - develop # Trigger on pushes to the main branch; adjust as needed.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up .NET
    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0 # Use .NET 8.0

    # Install dependencies and build the project
    - name: Build .NET application
      run: |
        dotnet restore
        dotnet build --configuration Release

    # Publish the project
    - name: Publish .NET application
      run: |
        dotnet publish --configuration Release --output ./publish

    # Zip the published output
    - name: Zip published application
      run: zip -r app.zip ./publish

    # Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        audience: sts.amazonaws.com
        aws-region: eu-central-1
        role-to-assume: arn:aws:iam::913524930277:role/github-actions-role

    # Authenticate with AWS CodeArtifact
    - name: Login to AWS CodeArtifact
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain croeer \
          --domain-owner 913524930277 \
          --query authorizationToken --output text)
        echo $CODEARTIFACT_AUTH_TOKEN > codeartifact-token.txt

    # Upload the artifact to AWS CodeArtifact
    - name: Upload artifact to CodeArtifact
      run: |
        aws codeartifact publish-package-version \
          --domain croeer \
          --repository zooplusplus \
          --format generic \
          --package zooplusplus \
          --package-version 1.0.0 \
          --namespace dev \
          --asset-content app.zip \
          --asset-name app.zip \
          --asset-sha256 $(shasum -a 256 app.zip | awk '{print $1;}')

